# fmt, clippy and tests on every push, and the tests on Windows too: an OS
# error words itself differently there, and no test should pin one platform's
# text for the release build to be the first to find out.
name: Checks

on: push

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rodio's ALSA backend links against libasound.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-
      # The toolchain and components rust-toolchain.toml names.
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    # Tests only: fmt and clippy read the same code on any OS, and the
    # 2.0.0 release proved it is the tests that differ by platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: windows-
      - run: rustup toolchain install
      - run: cargo test --workspace
