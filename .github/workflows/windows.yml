# A Windows build for testers, started by hand (Actions → Windows build → Run
# workflow). The download holds both modes: `typewriter.exe` is the normal
# one, the default, beside `typewriter-plain.exe` and `typewriter-import.exe`.
name: Windows build

on: workflow_dispatch

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: windows-
      - run: rustup toolchain install
      - run: cargo test --workspace --release
      - run: cargo build --release --workspace --bins
      # Flat: the programs and the license side by side in the download.
      - run: |
          New-Item -ItemType Directory dist
          Copy-Item target/release/typewriter.exe, target/release/typewriter-plain.exe, target/release/typewriter-import.exe, LICENSE dist
      - uses: actions/upload-artifact@v7
        with:
          name: typewriter-windows
          path: dist
