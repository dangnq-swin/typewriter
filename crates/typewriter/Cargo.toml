[package]
name = "typewriter"
description = "The typewriter on a desk: the immersive edition, with the plain one beside it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Three commands from one package: `typewriter` the desk edition (main.rs),
# the default; `typewriter-plain` the focused writing tool; and
# `typewriter-import`, the console importer for Windows.

[dependencies]
typewriter-core.workspace = true
typewriter-ui.workspace = true
eframe.workspace = true
anyhow.workspace = true

[dev-dependencies]
typewriter-ui = { workspace = true, features = ["snapshot"] }

[lints]
workspace = true
