[package]
name = "typewriter-render"
description = "The render crate: the window the app opens and the renderer that draws the desk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
egui.workspace = true
# The crate is checked and linted alone, where nothing else's dependency
# graph would turn egui-wgpu's winit module on for the window.
egui-wgpu = { workspace = true, features = ["winit"] }
egui-winit.workspace = true
glam.workspace = true
half.workspace = true
pollster.workspace = true
wgpu.workspace = true
winit.workspace = true

[lints]
workspace = true
