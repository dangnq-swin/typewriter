[workspace]
resolver = "3"
members = [
    "crates/typewriter-core",
    "crates/typewriter-ui",
    "crates/typewriter",
]
# Plain `cargo run` opens the desk edition, the default. Build, test and lint
# with --workspace; the plain app is `cargo run --bin typewriter-plain`.
default-members = ["crates/typewriter"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
typewriter-core = { path = "crates/typewriter-core" }
typewriter-ui = { path = "crates/typewriter-ui" }
eframe = "0.36"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
ron = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.17"
# Days for the writing log: local ones (std can't read the time zone), and
# dates in folder files.
jiff = { version = "0.2", features = ["serde"] }
# Without its HTML layout engine: pages are drawn op by op.
printpdf = { version = "0.12", default-features = false }
# Reading .odt files: only the decoder ODF packages need.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }

# Optimise image decoding even in debug: the paper texture is painfully slow
# to decode and resize otherwise (build script, startup, own textures).
[profile.dev.build-override]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
