[workspace]
resolver = "3"
members = ["crates/typewriter-core", "crates/typewriter-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
typewriter-core = { path = "crates/typewriter-core" }
eframe = "0.36"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
ron = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rfd = "0.17"
# Without its HTML layout engine: pages are drawn op by op.
printpdf = { version = "0.12", default-features = false }
# Reading .odt files: only the decoder ODF packages need.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }

# Optimise image decoding even in debug: the paper texture is painfully slow
# to decode and resize otherwise (build script and startup).
[profile.dev.build-override]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
