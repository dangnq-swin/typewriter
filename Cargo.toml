[workspace]
resolver = "3"
members = ["crates/typewriter-core", "crates/typewriter-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
typewriter-core = { path = "crates/typewriter-core" }
eframe = "0.36"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }

# Decoding and resizing the paper texture is painfully slow unoptimised,
# both in the build script and at startup of debug builds.
[profile.dev.build-override]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
