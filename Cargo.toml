[workspace]
resolver = "3"
members = [
    "crates/typewriter-core",
    "crates/typewriter-render",
    "crates/typewriter-ui",
    "crates/typewriter",
]
# Plain `cargo run` opens normal mode, the default. Build, test and lint
# with --workspace; the plain app is `cargo run --bin typewriter-plain`.
default-members = ["crates/typewriter"]

[workspace.package]
version = "2.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
typewriter-core = { path = "crates/typewriter-core" }
typewriter-render = { path = "crates/typewriter-render" }
typewriter-ui = { path = "crates/typewriter-ui" }
eframe = "0.36"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
ron = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.17"
# Days for the writing log: local ones (std can't read the time zone), and
# dates in folder files.
jiff = { version = "0.2", features = ["serde"] }
# Without its HTML layout engine: pages are drawn op by op.
printpdf = { version = "0.12", default-features = false }
# Reading .odt files: only the decoder ODF packages need.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }
# The depth pass's machine millimetres, clip rows and shader-ready bytes.
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
# Accented letters as base and accent, from Unicode's own decompositions.
unicode-normalization = "0.1"
# The bundled fonts' tables: what they can print, and their metrics.
ttf-parser = "0.25"
# egui's own maths crate, kept in step with it: the rotation and easing
# primitives egui does not re-export.
emath = "0.36"
# The desktop's folders for our config, data and drafts.
directories = "6"
# Handing a project to the open app, on sockets and named pipes alike.
interprocess = "2.4"
# Opening a printout in the desktop's PDF viewer.
open = "5"
# Crash-safe writes: temp file, fsync, rename.
atomic-write-file = "0.3"
# egui and the window stack under it, one version pair throughout: the
# render crate drives them directly, at the pair eframe re-exports.
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", features = ["accesskit"] }
wgpu = "30.0"
# egui-wgpu blocks on its own painter's setup with this.
pollster = "1.0"
winit = "0.30"

# Optimise image decoding even in debug: the paper texture is painfully slow
# to decode and resize otherwise (build script, startup, own textures).
[profile.dev.build-override]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
